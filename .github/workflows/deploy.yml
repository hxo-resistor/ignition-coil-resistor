name: Deploy to GitHub Pages

# 注意：自动部署已由 build-and-deploy.yml（含 Markdown→HTML 构建步骤）接管。
# 本工作流保留仅为手动兜底（workflow_dispatch），不再随 push 自动触发，
# 以避免它与构建工作流并发部署、互相覆盖。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
